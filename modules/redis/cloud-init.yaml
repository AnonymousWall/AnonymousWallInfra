#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl

runcmd:
  - dnf install -y podman

  # Firewall — only allow Redis port from private subnet, never from public
  - systemctl start firewalld
  - systemctl enable firewalld
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="${private_subnet_cidr}" port port="6379" protocol="tcp" accept'
  - firewall-cmd --reload

  # Create data directory for Redis persistence and secure config
  - mkdir -p /opt/redis/data
  - chown opc:opc /opt/redis/data
  - chmod 700 /opt/redis

  # Enable linger before starting container so it survives reboots
  - loginctl enable-linger opc

  # Pull and run Redis container with Podman — password passed via config file, not CLI
  - podman pull docker.io/redis:7-alpine
  - podman run -d --name redis --restart=always -p 6379:6379 -v /opt/redis/data:/data -v /opt/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro redis:7-alpine redis-server /usr/local/etc/redis/redis.conf

  # Apply SSH keepalive config
  - systemctl restart sshd

write_files:
  # Redis configuration — password stored in file rather than CLI arg to avoid exposure in ps listings
  - path: /opt/redis/redis.conf
    owner: root:root
    permissions: '0600'
    content: |
      appendonly yes
      requirepass ${redis_password}

  - path: /etc/ssh/sshd_config.d/99-keepalive.conf
    owner: root:root
    permissions: '0600'
    content: |
      ClientAliveInterval 30
      ClientAliveCountMax 6
      MaxStartups 50:30:200

final_message: "Redis instance is ready for ${app_name}"
