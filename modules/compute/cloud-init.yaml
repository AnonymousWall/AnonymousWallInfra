#cloud-config
package_update: true
package_upgrade: true

packages:
  - python3-pip
  - git
  - curl
  - wget
  - vim

runcmd:
  # Install Podman and podman-compose on OL9
  - dnf install -y podman
  # Pinned for OL9 compatibility; update intentionally when validated with Podman.
  - pip3 install podman-compose==1.0.6

  # Enable Podman socket for Docker-compatible CLI usage
  - systemctl enable --now podman.socket
  
  # Configure firewall - ensure it's running first
  - systemctl start firewalld
  - systemctl enable firewalld
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --permanent --add-port=8080/tcp
  - firewall-cmd --reload
  
  # Create app directory and logs with correct permissions
  - mkdir -p /opt/${app_name}
  - chown opc:opc /opt/${app_name}
  # Enable linger for opc user to keep services running after SSH session ends
  - loginctl enable-linger opc

  # Reload systemd to pick up the new service file
  - systemctl daemon-reload
  - systemctl enable ${app_name}

write_files:
  - path: /etc/systemd/system/${app_name}.service
    content: |
      [Unit]
      Description=${app_name} Backend Service
      After=network-online.target podman.socket
      Requires=podman.socket
      Wants=network-online.target

      [Service]
      Type=simple
      User=opc
      WorkingDirectory=/opt/${app_name}
      ExecStartPre=-/usr/bin/podman rm -f ${app_name}-backend
      ExecStart=/usr/local/bin/podman-compose -f /opt/${app_name}/docker-compose.prod.yml up
      ExecStop=/usr/local/bin/podman-compose -f /opt/${app_name}/docker-compose.prod.yml down
      Restart=on-failure
      RestartSec=30
      StartLimitInterval=300
      StartLimitBurst=5

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'

final_message: "The system is ready for ${app_name} backend deployment"