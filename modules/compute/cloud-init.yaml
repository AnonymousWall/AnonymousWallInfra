#cloud-config
package_update: true
package_upgrade: true

packages:
  - yum-utils
  - git
  - curl
  - wget
  - vim

runcmd:
  # Add Docker's official repository for Oracle Linux
  # Note: Using CentOS repository as it's compatible with Oracle Linux (RHEL-based)
  - yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
  
  # Remove conflicting packages (Oracle Linux 9 comes with Podman by default)
  - dnf remove -y docker docker-* podman buildah runc || true
  
  # Install Docker CE and related packages
  - dnf install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  
  # Start and enable Docker
  - systemctl start docker
  - systemctl enable docker
  
  # Add default user to docker group
  - usermod -aG docker opc
  
  # Configure firewall - ensure it's running first
  - systemctl start firewalld
  - systemctl enable firewalld
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --permanent --add-port=8080/tcp
  - firewall-cmd --reload
  
  # Create app directory
  - mkdir -p /opt/${app_name}
  - chown opc:opc /opt/${app_name}

write_files:
  - path: /etc/systemd/system/${app_name}.service
    content: |
      [Unit]
      Description=${app_name} Backend Service
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/${app_name}
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'

final_message: "The system is ready for ${app_name} backend deployment"
