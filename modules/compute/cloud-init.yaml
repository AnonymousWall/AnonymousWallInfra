#cloud-config
package_update: true
package_upgrade: true

packages:
  - python3-pip
  - git
  - curl
  - wget
  - vim

runcmd:
  # Install Podman and podman-compose on OL9
  - dnf install -y podman
  - pip3 install podman-compose
  - ln -sf /usr/bin/podman /usr/bin/docker

  # Enable Podman socket for Docker-compatible CLI usage
  - systemctl enable --now podman.socket
  
  # Configure firewall - ensure it's running first
  - systemctl start firewalld
  - systemctl enable firewalld
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --permanent --add-port=8080/tcp
  - firewall-cmd --reload
  
  # Create app directory
  - mkdir -p /opt/${app_name}
  - chown opc:opc /opt/${app_name}

write_files:
  - path: /etc/systemd/system/${app_name}.service
    content: |
      [Unit]
      Description=${app_name} Backend Service
      After=network-online.target podman.socket
      Requires=podman.socket
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/${app_name}
      ExecStart=/usr/bin/podman-compose up -d
      ExecStop=/usr/bin/podman-compose down

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'

final_message: "The system is ready for ${app_name} backend deployment"
