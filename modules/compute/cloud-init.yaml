#cloud-config

# Enable detailed logging for cloud-init debugging
output: {all: '| tee -a /var/log/cloud-init-output.log'}

package_update: true
package_upgrade: true

packages:
  - podman
  - podman-compose
  - git
  - curl
  - wget
  - vim

runcmd:
  # Log network connectivity for debugging
  - echo "=== Cloud-init network debug ===" | tee -a /var/log/cloud-init-debug.log
  - date | tee -a /var/log/cloud-init-debug.log
  - echo "Checking network connectivity..." | tee -a /var/log/cloud-init-debug.log
  - ip addr show | tee -a /var/log/cloud-init-debug.log
  - ip route show | tee -a /var/log/cloud-init-debug.log
  - cat /etc/resolv.conf | tee -a /var/log/cloud-init-debug.log
  - ping -c 3 8.8.8.8 | tee -a /var/log/cloud-init-debug.log || echo "Ping to 8.8.8.8 failed" | tee -a /var/log/cloud-init-debug.log
  - ping -c 3 oracle.com | tee -a /var/log/cloud-init-debug.log || echo "Ping to oracle.com failed" | tee -a /var/log/cloud-init-debug.log
  - curl -I https://yum.oracle.com 2>&1 | tee -a /var/log/cloud-init-debug.log || echo "Curl to yum.oracle.com failed" | tee -a /var/log/cloud-init-debug.log
  - echo "Checking yum configuration..." | tee -a /var/log/cloud-init-debug.log
  - yum repolist 2>&1 | tee -a /var/log/cloud-init-debug.log
  - echo "=== End network debug ===" | tee -a /var/log/cloud-init-debug.log
  
  # Start and enable Podman socket (for compatibility with docker-compose tools)
  - systemctl start podman.socket
  - systemctl enable podman.socket
  
  # Configure firewall - ensure it's running first
  - systemctl start firewalld
  - systemctl enable firewalld
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --permanent --add-port=8080/tcp
  - firewall-cmd --reload
  
  # Create app directory
  - mkdir -p /opt/${app_name}
  - chown opc:opc /opt/${app_name}

write_files:
  - path: /etc/systemd/system/${app_name}.service
    content: |
      [Unit]
      Description=${app_name} Backend Service
      After=podman.socket
      Requires=podman.socket

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/${app_name}
      ExecStart=/usr/bin/podman-compose up -d
      ExecStop=/usr/bin/podman-compose down

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'

final_message: "The system is ready for ${app_name} backend deployment"
