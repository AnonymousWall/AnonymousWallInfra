#cloud-config
package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - wget
  - vim

runcmd:
  # Install Docker using official convenience script for Oracle Linux 8
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - rm /tmp/get-docker.sh
  
  # Start and enable Docker
  - systemctl start docker
  - systemctl enable docker
  
  # Add default user to docker group
  - usermod -aG docker opc
  
  # Install docker-compose
  - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  - chmod +x /usr/local/bin/docker-compose
  - ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose
  
  # Configure firewall - ensure it's running first
  - systemctl start firewalld
  - systemctl enable firewalld
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --permanent --add-port=8080/tcp
  - firewall-cmd --reload
  
  # Create app directory
  - mkdir -p /opt/${app_name}
  - chown opc:opc /opt/${app_name}

write_files:
  - path: /etc/systemd/system/${app_name}.service
    content: |
      [Unit]
      Description=${app_name} Backend Service
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/${app_name}
      ExecStart=/usr/bin/docker-compose up -d
      ExecStop=/usr/bin/docker-compose down

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'

final_message: "The system is ready for ${app_name} backend deployment"
